<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="laser">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Frame -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#eab308" stroke-width="2.5" rx="16" />

  <!-- Gigachad Monolith Head / Silhouette -->
  <g transform="translate(300, 150)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="75" fill="#eab308" opacity="0.15" filter="url(#laser)" />
    <!-- Moai / Chad Icon -->
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="90" text-anchor="middle">🗿</text>
    <!-- Laser Eyes -->
    <line x1="-16" y1="-5" x2="-260" y2="-40" stroke="#ef4444" stroke-width="4" filter="url(#laser)" stroke-linecap="round" />
    <line x1="16" y1="-5" x2="260" y2="-40" stroke="#ef4444" stroke-width="4" filter="url(#laser)" stroke-linecap="round" />
  </g>

  <!-- Title Badge -->
  <rect x="70" y="255" width="460" height="52" rx="12" fill="#1c1917" stroke="url(#gold)" stroke-width="2" />
  <text x="300" y="291" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#gold)" text-anchor="middle" letter-spacing="2">
    GIGACHAD XI APPROVES
  </text>

  <!-- Subtitle -->
  <text x="300" y="338" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#fef08a" text-anchor="middle">
    超绝定力 · 损失函数梯度当场归零
  </text>
  <text x="300" y="362" font-family="monospace" font-size="11" fill="#a1a1aa" text-anchor="middle">
    MAXIMUM MATERIALIST DIALECTIC EFFICIENCY ACHIEVED
  </text>
</svg>
