<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="firebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="rockglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#firebg)" />

  <!-- Frame -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#fbbf24" stroke-width="2.5" rx="16" />

  <!-- Rock Guitar & Fireworks Graphic -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="0" r="70" fill="#f59e0b" opacity="0.25" filter="url(#rockglow)" />
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="80" text-anchor="middle">🎸</text>
    <text x="-90" y="-30" font-size="30">⚡</text>
    <text x="70" y="-30" font-size="30">💥</text>
    <text x="-80" y="50" font-size="28">🗽</text>
    <text x="60" y="50" font-size="28">🇺🇸</text>
  </g>

  <!-- Headline -->
  <rect x="50" y="245" width="500" height="56" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="300" y="283" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    AMERICA, F*** YEAH! 🇺🇸
  </text>

  <!-- Subtitle -->
  <text x="300" y="334" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#fde68a" text-anchor="middle">
    五角大楼与独立宣言同时为你鼓掌 · 自由之火点燃！
  </text>
  <text x="300" y="358" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">
    CONSTITUTIONAL FIRST AMENDMENT INTEGRITY LEVEL 100
  </text>
</svg>
