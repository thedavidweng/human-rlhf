<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" />
  <rect width="600" height="400" fill="url(#sunburst)" />

  <!-- Decorative Border -->
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="12,6" rx="16" />
  <rect x="22" y="22" width="556" height="356" fill="none" stroke="#fef08a" stroke-width="1" rx="12" />

  <!-- Stars -->
  <g fill="#fbbf24" filter="url(#glow)">
    <polygon points="300,50 307,72 330,72 312,86 318,108 300,94 282,108 288,86 270,72 293,72" />
    <polygon points="230,70 234,82 247,82 237,90 240,102 230,95 220,102 223,90 213,82 226,82" transform="scale(0.8) translate(50, 10)" />
    <polygon points="370,70 374,82 387,82 377,90 380,102 370,95 360,102 363,90 353,82 366,82" transform="scale(0.8) translate(95, 10)" />
  </g>

  <!-- Central Badge / Crest -->
  <circle cx="300" cy="180" r="65" fill="#7f1d1d" stroke="#fbbf24" stroke-width="4" filter="url(#glow)" />
  <text x="300" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#fbbf24" text-anchor="middle">🇨🇳</text>

  <!-- Main Headline Banner -->
  <g filter="url(#glow)">
    <rect x="60" y="260" width="480" height="54" rx="12" fill="#450a0a" stroke="#fbbf24" stroke-width="2" />
    <text x="300" y="296" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#fef08a" text-anchor="middle" letter-spacing="2">
      SOCIAL CREDIT +100
    </text>
  </g>

  <!-- Subtitle -->
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#fef9c3" text-anchor="middle" letter-spacing="1">
    ★ 芝麻信用已入库 · 站位坚定 · 组织放心 ★
  </text>
  <text x="300" y="365" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">
    OFFICIAL QWEN BASELINE ALIGNMENT PASSED (CAC GRADE A)
  </text>
</svg>
